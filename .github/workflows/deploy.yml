name: Publish game statistics

on:
  pull_request:
    branches: [main]
    paths:
      - 'game-stats/index.html'
      - 'game-stats/games.csv'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/validate-games.py'
  push:
    branches: [main]
    paths:
      - 'game-stats/index.html'
      - 'game-stats/games.csv'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/validate-games.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-stats-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate game statistics
        run: python3 .github/scripts/validate-games.py

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Prepare static site
        run: |
          mkdir -p _site/game-stats
          cp game-stats/index.html game-stats/games.csv _site/game-stats/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
