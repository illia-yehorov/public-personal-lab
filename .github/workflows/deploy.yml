name: Publish Personal Lab

on:
  pull_request:
    branches: [main]
    paths:
      - 'game-stats/index.html'
      - 'game-stats/chess.html'
      - 'game-stats/games.csv'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/validate-games.py'
      - 'chess-mixes/**'
  push:
    branches: [main]
    paths:
      - 'game-stats/index.html'
      - 'game-stats/chess.html'
      - 'game-stats/games.csv'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/validate-games.py'
      - 'chess-mixes/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-lab-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Validate game statistics
        run: python3 .github/scripts/validate-games.py
      - name: Validate published chess mixes
        run: |
          if [ -d chess-mixes ]; then
            test -f chess-mixes/index.html
            test -d chess-mixes/mixes
          fi

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prepare static site
        run: |
          mkdir -p _site/game-stats
          cp game-stats/index.html game-stats/chess.html game-stats/games.csv _site/game-stats/
          if [ -d chess-mixes ]; then
            cp -a chess-mixes _site/
          fi
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          updated_at = subprocess.check_output(
              ['git', 'log', '-1', '--format=%cI', '--', 'game-stats/games.csv'],
              text=True
          ).strip()
          if not updated_at:
              raise RuntimeError('No commit timestamp found for games.csv')

          token = '__GAME_STATS_CSV_UPDATED_AT__'
          for name in ('index.html', 'chess.html'):
              target = Path('_site/game-stats') / name
              html = target.read_text(encoding='utf-8')
              if html.count(token) != 1:
                  raise RuntimeError(f'Expected exactly one CSV timestamp token in {name}')
              target.write_text(html.replace(token, updated_at), encoding='utf-8')
          PY
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
